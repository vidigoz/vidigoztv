[build]
  publish   = "site"
  functions = "netlify/functions"

# ── Newsletter: cron diario (Netlify Scheduled Function) ─────────────────────
# 9am UTC ≈ 3am Tecate. Revisa envíos programados vencidos y, si no hay, toma la
# historia más antigua con Estado = Programado que no se haya enviado aún.
[functions."newsletter-cron"]
  schedule = "0 9 * * *"

# ── Taller: cada herramienta vive en su subcarpeta dentro de site/ ────────────
[[redirects]]
  from   = "/taller/vidiclip"
  to     = "/taller/vidiclip/index.html"
  status = 200

[[redirects]]
  from   = "/taller/vidiserial"
  to     = "/taller/vidiserial/index.html"
  status = 200

[[redirects]]
  from   = "/taller/vidiwrite"
  to     = "/taller/vidiwrite/index.html"
  status = 200

[[redirects]]
  from   = "/taller/analytics"
  to     = "/taller/analytics/index.html"
  status = 200

[[redirects]]
  from   = "/taller/newsletter"
  to     = "/taller/newsletter/index.html"
  status = 200

# ── SPA fallback — debe ir al final ──────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Headers de seguridad ──────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# El dashboard de newsletter muestra la vista previa del correo en un iframe
# same-origin (columna 11 del kanban). DENY global bloquea incluso ese caso;
# SAMEORIGIN permite que el propio sitio se enmarque a sí mismo sin abrir la
# puerta a que un sitio externo lo haga (sigue bloqueado para terceros).
[[headers]]
  for = "/.netlify/functions/newsletter-preview"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
